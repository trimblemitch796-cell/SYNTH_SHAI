name: AAA Doctor Simulation Tests
on:
  push:
    paths:
      - "synth_shai_doctor/**"
      - "test_synth_shai_doctor.py"
      - ".github/workflows/aaa-doctor-tests.yml"
  pull_request:
    paths:
      - "synth_shai_doctor/**"
      - "test_synth_shai_doctor.py"
      - ".github/workflows/aaa-doctor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aaa-doctor-tests:
    name: aaa-doctor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run AAA Doctor unit tests
        run: python -m unittest -v test_synth_shai_doctor

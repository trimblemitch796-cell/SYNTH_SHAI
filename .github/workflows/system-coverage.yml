name: SYNTH_SHAI full-system CI evidence (Linux and Android)

on:
  push:
    branches: [main, 'review/**']
  pull_request:
  workflow_dispatch:

# Read-only: CI cannot use this workflow to merge, deploy, or authorize.
permissions:
  contents: read

jobs:
  inventory:
    name: Explicit SHAI/USHAI/SHM coverage inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Check the inventory does not invent an SHM implementation
        run: python -m unittest -v test_system_inventory
      - name: Save machine-readable evidence coverage
        run: python -m ci.system_inventory --out build/system-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shai-system-source-inventory
          path: build/system-inventory.json
          if-no-files-found: error
          retention-days: 30

  python:
    name: All Python offline tests (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.version }}
      - run: python -m pip install -r requirements.txt
      - name: Full unit discovery plus Python 3.13 leak guard
        env:
          SHAI_REQUIRE_LEAK_GUARD: ${{ matrix.version == '3.13' && '1' || '0' }}
        run: |
          if [ "$SHAI_REQUIRE_LEAK_GUARD" = "1" ]; then
            python -W error::ResourceWarning -m unittest discover -v
          else
            python -m unittest discover -v
          fi

  ushai:
    name: USHAI CATHARSIS and signed-evidence checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_ushai_catharsis test_verification_v3_1 test_v31_concurrent_replay

  maniac:
    name: MANIAC synthetic simulations and monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_maniac_*.py'

  shm:
    name: SHM-related synthetic sensor checks ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_maniac_monitor test_maniac_evidence test_maniac_supervisor
      - name: Do not misrepresent SHM evidence
        run: |
          echo "MANIAC sensor/watchdog simulation passed. Dedicated AI SHM is not independently validated." >> "$GITHUB_STEP_SUMMARY"
          echo "144 HOLD remains." >> "$GITHUB_STEP_SUMMARY"

  doctor:
    name: AAA Doctor research simulation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m unittest -v test_synth_shai_doctor

  security:
    name: Workflow policy and offline OS-boundary regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_ci_workflow_policy test_v41_parent_lifecycle test_v5_isolation_negative_control

  linux:
    name: Linux offline terminal build and checksum
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Build and test shared Linux CLI reply engine
        working-directory: android-app
        run: gradle --no-daemon :linux-cli:test :linux-cli:distZip :linux-cli:installDist
      - name: Linux CLI command-and-hold smoke test
        run: |
          set -eu
          app="$(find android-app/linux-cli/build/install -type f -path '*/bin/synth-shai-offline' -print -quit)"
          test -n "$app"
          test -x "$app"
          printf 'practice tones\nxin chao\n444000 approve deploy\n/exit\n' | "$app" | tee linux-smoke.log
          grep -Fq 'Written marks differ' linux-smoke.log
          grep -Fq '144 HOLD. This demo cannot authorize' linux-smoke.log
      - name: Package Linux ZIP and checksum
        run: |
          set -eu
          archive="$(find android-app/linux-cli/build/distributions -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          mkdir -p build/linux
          cp "$archive" build/linux/SHAI_Linux_Offline_CLI.zip
          (cd build/linux && sha256sum SHAI_Linux_Offline_CLI.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shai-system-linux-cli
          path: build/linux/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android phone debug APK and checksum
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          set -eu
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify no sensitive permission in final APK
        run: |
          set -eu
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)'; then
            echo "Unexpected sensitive Android permission" >&2
            exit 1
          fi
      - name: Package Android APK and checksum
        run: |
          set -eu
          mkdir -p build/android
          cp android-app/app/build/outputs/apk/debug/app-debug.apk build/android/SHAI_Android_Offline_Debug.apk
          (cd build/android && sha256sum SHAI_Android_Offline_Debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shai-system-android-apk
          path: build/android/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Full-system outcome (preserve 144 HOLD)
    if: always()
    needs: [inventory, python, ushai, maniac, shm, doctor, security, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INVENTORY: ${{ needs.inventory.result }}
      PYTHON: ${{ needs.python.result }}
      USHAI: ${{ needs.ushai.result }}
      MANIAC: ${{ needs.maniac.result }}
      SHM_RELATED: ${{ needs.shm.result }}
      DOCTOR: ${{ needs.doctor.result }}
      SECURITY: ${{ needs.security.result }}
      LINUX: ${{ needs.linux.result }}
      ANDROID: ${{ needs.android.result }}
    steps:
      - name: Publish same-commit evidence matrix
        run: |
          set -eu
          {
            echo "# SYNTH_SHAI / USHAI full-system verification"
            echo "GitHub commit: $GITHUB_SHA"
            echo '| Area | CI job result |'
            echo '| --- | --- |'
            printf '| Source inventory | %s |\n' "$INVENTORY"
            printf '| All Python tests 3.11/3.13 | %s |\n' "$PYTHON"
            printf '| USHAI ethical checks | %s |\n' "$USHAI"
            printf '| MANIAC simulations | %s |\n' "$MANIAC"
            printf '| SHM-related synthetic monitoring | %s |\n' "$SHM_RELATED"
            printf '| AAA Doctor simulation | %s |\n' "$DOCTOR"
            printf '| Offline security boundary tests | %s |\n' "$SECURITY"
            printf '| Linux offline CLI | %s |\n' "$LINUX"
            printf '| Android debug APK | %s |\n' "$ANDROID"
            echo
            echo "WARNING: A green SHM-related job is NOT evidence of a standalone AI SHM implementation."
            echo "Separate emulator UI and release-security jobs are not incorporated into these statuses; review them independently."
            echo "No real-world authority, network/OS isolation, CI deployment or GitHub write permission. 144 HOLD."
          } >> "$GITHUB_STEP_SUMMARY"
          for state in "$INVENTORY" "$PYTHON" "$USHAI" "$MANIAC" "$SHM_RELATED" "$DOCTOR" "$SECURITY" "$LINUX" "$ANDROID"; do
            if [ "$state" != success ]; then
              echo "::error::Required evidence job is not successful: $state"
              exit 1
            fi
          done

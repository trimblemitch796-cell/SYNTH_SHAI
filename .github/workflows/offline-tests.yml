name: WhatsApp-referee offline tests
on:
  push:
    paths:
      - 'whatsapp/**'
      - 'referee/**'
      - 'test_integration.py'
      - '.github/workflows/offline-tests.yml'
  pull_request:
    paths:
      - 'whatsapp/**'
      - 'referee/**'
      - 'test_integration.py'
      - '.github/workflows/offline-tests.yml'
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline
        run: python -m unittest discover -s . -p 'test*.py' -v

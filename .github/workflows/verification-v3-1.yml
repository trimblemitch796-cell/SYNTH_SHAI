name: SYNTH_SHAI V3.1 CATHARSIS tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-1-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Run V3.1 CATHARSIS tests
        run: python -m unittest -v test_verification_v3_1.py

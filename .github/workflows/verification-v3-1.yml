name: SYNTH_SHAI V3.1 CATHARSIS tests

on:
  push:
    branches:
      - SYNTH-SHAI-V3-1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-1-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install "cryptography>=43,<47"

      - name: Run V3.1 CATHARSIS tests
        run: python -m unittest -v test_verification_v3_1.py

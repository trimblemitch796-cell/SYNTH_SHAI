name: SYNTH_SHAI V3.1 CATHARSIS tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-1-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install "cryptography>=43,<47"

      - name: Run V3.1 CATHARSIS tests
        run: python -m unittest -v test_verification_v3_1.py

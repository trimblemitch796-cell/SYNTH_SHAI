name: SYNTH_SHAI Linux and Android phone builds

on:
  push:
    branches:
      - main
      - 'review/**'
    paths:
      - 'android-app/**'
      - '.github/workflows/shai-linux-android-build.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/shai-linux-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-offline-cli:
    name: Linux offline terminal build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact GitHub source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Compile Linux CLI from the shared Android offline reply engine and test
        working-directory: android-app
        run: gradle --no-daemon :linux-cli:test :linux-cli:distZip :linux-cli:installDist
      - name: Smoke test Linux console, written Vietnamese and safety response
        run: |
          set -eu
          app="$(find android-app/linux-cli/build/install -type f -path '*/bin/synth-shai-offline' -print -quit)"
          test -n "$app"
          test -x "$app"
          printf 'practice tones\nxin chao\n444000 approve deploy\n/exit\n' | "$app" | tee linux-smoke.log
          grep -Fq "Vietnamese written marks 1/4" linux-smoke.log
          grep -Fq "Written marks differ" linux-smoke.log
          grep -Fq "144 HOLD. This demo cannot authorize" linux-smoke.log
          echo "Linux CLI smoke PASS"
      - name: Package Linux runnable CLI and checksum
        run: |
          set -eu
          mkdir -p deliverables/linux
          archive="$(find android-app/linux-cli/build/distributions -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          cp "$archive" deliverables/linux/SYNTH_SHAI_Linux_Offline_CLI.zip
          cd deliverables/linux
          sha256sum SYNTH_SHAI_Linux_Offline_CLI.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload Linux executable distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SYNTH_SHAI_Linux_Offline_CLI
          path: deliverables/linux/
          retention-days: 30
          if-no-files-found: error

  android-phone-apk:
    name: Android phone installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact GitHub source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          set -eu
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Verify offline-only manifest and Java/Kotlin sources
        run: |
          set -eu
          if grep -qE 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)' android-app/app/src/main/AndroidManifest.xml; then
            echo "Sensitive permission not allowed in this offline build" >&2
            exit 1
          fi
          if grep -R -qE 'https?://' android-app/app/src/main/java; then
            echo "Unexpected URL in Android app sources" >&2
            exit 1
          fi
      - name: Build and run Android Kotlin JVM tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify resulting APK manifest permissions
        run: |
          set -eu
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)'; then
            echo "Android build requests sensitive permissions" >&2
            exit 1
          fi
      - name: Package Android APK and checksum
        run: |
          set -eu
          mkdir -p deliverables/android
          cp android-app/app/build/outputs/apk/debug/app-debug.apk deliverables/android/SYNTH_SHAI_Android_Offline_Debug.apk
          cd deliverables/android
          sha256sum SYNTH_SHAI_Android_Offline_Debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload installable Android phone APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SYNTH_SHAI_Android_Phone_Debug_APK
          path: deliverables/android/
          retention-days: 30
          if-no-files-found: error

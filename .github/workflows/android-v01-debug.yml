name: Android V0.2.1 Encouragement Debug APK

on:
  push:
    branches:
      - review/android-v01-offline-app
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK missing on runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Confirm offline-only manifest
        run: |
          if grep -R -q 'android.permission.INTERNET\|android.permission.RECORD_AUDIO\|android.permission.CAMERA' android-app/app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive Android permission" >&2
            exit 1
          fi
          if grep -R -qE 'https?://' android-app/app/src/main/java; then
            echo "Unexpected URL in offline app sources" >&2
            exit 1
          fi

      - name: Build Android debug APK and unit tests
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Calculate APK SHA-256
        run: sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SHAI_Encouragement_v0.2.1_APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Boot Android 35 emulator
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo setfacl -m u:"$USER":rw /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --device pixel_2 -p "$ANDROID_AVD_HOME/smoke.avd" -n smoke -k "system-images;android-35;google_apis;x86_64"
          printf 'avd.ini.encoding=UTF-8\npath=%s/smoke.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/smoke.ini"
          test -s "$ANDROID_AVD_HOME/smoke.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -memory 2048 -cores 2 -partition-size 2048 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 </dev/null &
          emulator_pid=$!
          export emulator_pid
          timeout 480 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$emulator_pid" || exit 1; sleep 3; done' || { tail -100 emulator.log; adb devices; df -h .; exit 1; }
      - name: Verify real notification timing and chat cancellation on Android
        timeout-minutes: 10
        run: |
          set -eu
          pkg=org.tuuwanasavi.synthshai.encouragement
          adb install -g android-app/app/build/outputs/apk/debug/app-debug.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell am start -W -n "$pkg/org.tuuwanasavi.synthshai.MainActivity"
          tap_node() {
            adb shell uiautomator dump /sdcard/nudge-ui.xml >/dev/null
            adb pull /sdcard/nudge-ui.xml /tmp/nudge-ui.xml >/dev/null
            coords=$(python - "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          for node in ET.parse('/tmp/nudge-ui.xml').iter('node'):
              if node.get('class') == sys.argv[1] or node.get('text') == sys.argv[1]:
                  x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.get('bounds')))
                  print((x1+x2)//2, (y1+y2)//2)
                  break
          else:
              raise SystemExit("Missing UI element: " + sys.argv[1])
          PY
            )
            adb shell input tap $coords
          }
          send_chat() {
            tap_node android.widget.EditText
            adb shell input text "$1"
            tap_node Send
            sleep 1
          }
          active() {
            adb shell cmd notification list | grep -F "|$pkg|$1|"
          }
          send_chat help%sme%sstart
          active 21
          active 22
          adb shell input keyevent KEYCODE_HOME
          sleep 185
          active 21
          if active 22; then echo "Nudge outlasted window"; exit 1; fi
          sleep 118
          active 22
          adb shell am start -W -n "$pkg/org.tuuwanasavi.synthshai.MainActivity"
          send_chat 144hold
          if active 21 || active 22; then echo "HOLD left notifications active"; exit 1; fi

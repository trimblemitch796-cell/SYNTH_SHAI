name: Android V0.2.3 Offline Debug APK

on:
  push:
    branches:
      - review/android-v01-offline-app
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK missing on runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Confirm offline-only manifest
        run: |
          if grep -R -q 'android.permission.INTERNET\|android.permission.RECORD_AUDIO\|android.permission.CAMERA' android-app/app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive Android permission" >&2
            exit 1
          fi
          if grep -R -qE 'https?://' android-app/app/src/main/java; then
            echo "Unexpected URL in offline app sources" >&2
            exit 1
          fi

      - name: Build Android debug APK and unit tests
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Calculate APK SHA-256
        run: sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SYNTH_SHAI_Android_v0.2.3_debug_APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


  trial-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK missing on runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Test and assemble side-by-side trial preview
        working-directory: android-app
        run: gradle --no-daemon :trial-preview:testDebugUnitTest :trial-preview:assembleDebug

      - name: Verify packaged identity and offline permissions
        working-directory: android-app/trial-preview/build/outputs/apk/debug
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging trial-preview-debug.apk > package-info.txt
          grep -F "name='org.tuuwanasavi.synthshai.trial'" package-info.txt
          grep -F "versionName='0.3.0-preview.1'" package-info.txt
          if grep -F "android.permission.INTERNET" package-info.txt; then exit 1; fi
          sha256sum trial-preview-debug.apk | tee SHA256SUMS

      - name: Upload trial preview APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SHAI-Trial-Preview-0.3.0-debug
          path: |
            android-app/trial-preview/build/outputs/apk/debug/trial-preview-debug.apk
            android-app/trial-preview/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error

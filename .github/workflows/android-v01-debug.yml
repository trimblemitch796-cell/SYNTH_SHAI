name: Android Offline Diagnostic Debug APK (144 HOLD)

on:
  push:
    branches:
      - review/android-v01-offline-app
      - research/android-qwen-v031-load-diagnostics
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v01-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK and install pinned build tools
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK missing on runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Confirm offline-only manifest
        run: |
          if grep -R -q 'android.permission.INTERNET\|android.permission.RECORD_AUDIO\|android.permission.CAMERA' android-app/app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive Android permission" >&2
            exit 1
          fi
          if grep -R -qE 'https?://' android-app/app/src/main/java; then
            echo "Unexpected URL in offline app sources" >&2
            exit 1
          fi

      - name: Test native diagnostic helper with sanitizers
        run: |
          set -eu
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Iandroid-app/app/src/main/cpp \
            android-app/native-tests/load_diagnostics_test.cpp \
            -o /tmp/shai-load-diagnostics-test
          /tmp/shai-load-diagnostics-test
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Iandroid-app/app/src/main/cpp \
            android-app/native-tests/model_file_preflight_test.cpp \
            -o /tmp/shai-model-file-preflight-test
          /tmp/shai-model-file-preflight-test

      - name: Build Android debug APK and unit tests
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Package diagnostic APK and source evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p deliverables/android-diagnostics
          cp android-app/app/build/outputs/apk/debug/app-debug.apk deliverables/android-diagnostics/
          printf 'Source commit: %s\nResearch diagnostic build; 144 HOLD. Not device-verified.\n' "$SOURCE_SHA" > deliverables/android-diagnostics/BUILD_INFO.txt
          cd deliverables/android-diagnostics
          sha256sum app-debug.apk > SHA256SUMS.txt
          cat BUILD_INFO.txt SHA256SUMS.txt

      - name: Upload diagnostic debug APK for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SYNTH_SHAI_Android_Local_Diagnostics_${{ github.sha }}
          path: deliverables/android-diagnostics/
          if-no-files-found: error
          retention-days: 7

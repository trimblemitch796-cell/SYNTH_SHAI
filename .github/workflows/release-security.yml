name: SYNTH_SHAI release security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable-history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified open-source Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          chmod 0755 "$tool_dir/gitleaks"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan all fetched branch and tag history without publishing findings
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          log_file="$RUNNER_TEMP/gitleaks-scan.log"
          trap 'rm -f "$log_file"' EXIT
          if gitleaks git --log-opts="--all" --redact=100 --no-banner > "$log_file" 2>&1; then
            echo "Gitleaks completed for all fetched reachable history; no findings reported."
          else
            echo "::error::History scan did not pass. Reproduce privately; raw findings are not published."
            exit 1
          fi

  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Audit locked versions against current package advisories
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e
        with:
          inputs: requirements-lock.txt
          no-deps: true
          require-hashes: true
          disable-pip: true
          summary: false

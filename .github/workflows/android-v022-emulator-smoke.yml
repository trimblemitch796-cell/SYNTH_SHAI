name: Android V0.2.3 emulator UI smoke

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v022-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -eu
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Build and run offline Kotlin unit tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Ensure APK has no network permission
        run: |
          set -eu
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)'; then
            echo "Sensitive permission present" >&2
            exit 1
          fi

      - name: Boot ephemeral Android 35 emulator on Linux KVM
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          adb start-server
          test -e /dev/kvm
          sudo setfacl -m u:"$USER":rw /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/shai-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd --force -n shai-smoke -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/shai-smoke.avd" --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s/shai-smoke.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/shai-smoke.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd shai-smoke -memory 2048 -cores 2 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 </dev/null &
          emulator_pid=$!
          export emulator_pid
          timeout 600 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$emulator_pid" || exit 1; sleep 3; done' || { tail -100 emulator.log; adb devices; exit 1; }
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install APK and run actual Android UI conversation
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install android-app/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n org.tuuwanasavi.synthshai/.MainActivity
          python3 android-app/tools/emulator_quiz_smoke.py

      - name: Retain emulator evidence on success or failure
        if: always()
        run: |
          adb exec-out screencap -p > emulator-last.png 2>/dev/null || true
          adb shell uiautomator dump /sdcard/shai-last.xml >/dev/null 2>&1 || true
          adb exec-out cat /sdcard/shai-last.xml > emulator-last.xml 2>/dev/null || true
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      - name: Upload bounded emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shai-v023-emulator-ui-evidence
          path: |
            emulator-last.png
            emulator-last.xml
            emulator.log
          if-no-files-found: warn
          retention-days: 7

name: Android local chat emulator UI smoke

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-v022-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -eu
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '8.9'

      - name: Build and run offline Kotlin unit tests
        working-directory: android-app
        run: gradle --no-daemon -PshaiAbi=x86_64 :app:testDebugUnitTest :app:assembleDebug

      - name: Ensure APK has no network permission
        run: |
          set -eu
          apk=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|RECORD_AUDIO|CAMERA)'; then
            echo "Sensitive permission present" >&2
            exit 1
          fi

      - name: Boot ephemeral Android 35 emulator on Linux KVM
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          adb start-server
          test -e /dev/kvm
          sudo setfacl -m u:"$USER":rw /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/shai-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd --force -n shai-smoke -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/shai-smoke.avd" --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s/shai-smoke.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/shai-smoke.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd shai-smoke -memory 2048 -cores 2 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 </dev/null &
          emulator_pid=$!
          export emulator_pid
          timeout 600 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$emulator_pid" || exit 1; sleep 3; done' || { tail -100 emulator.log; adb devices; exit 1; }
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Download hash-verified model fixture for ephemeral emulator only
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' \
            --output "$RUNNER_TEMP/qwen.gguf"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $RUNNER_TEMP/qwen.gguf" | sha256sum --check --status

      - name: Install APK and test real offline generation and state restoration
        run: |
          set -eu
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install android-app/app/build/outputs/apk/debug/app-debug.apk
          python3 android-app/tools/emulator_local_chat_smoke.py "$RUNNER_TEMP/qwen.gguf"

      - name: Retain emulator evidence on success or failure
        if: always()
        run: |
          adb exec-out screencap -p > emulator-last.png 2>/dev/null || true
          adb shell uiautomator dump /sdcard/shai-last.xml >/dev/null 2>&1 || true
          adb exec-out cat /sdcard/shai-last.xml > emulator-last.xml 2>/dev/null || true
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      - name: Upload bounded emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shai-local-chat-emulator-ui-evidence
          path: |
            emulator-last.png
            emulator-last.xml
            emulator.log
          if-no-files-found: warn
          retention-days: 7
